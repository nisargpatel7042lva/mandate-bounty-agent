[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
# Shared mandate test vectors live in the shared package.
fs_permissions = [{ access = "read", path = "../shared/test-vectors" }, { access = "read", path = "../zkverify/test-vectors" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
